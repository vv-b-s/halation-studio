<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a161c" />
      <stop offset="55%" stop-color="#0e0f13" />
      <stop offset="100%" stop-color="#08090b" />
    </radialGradient>
    <radialGradient id="halationHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e0" stop-opacity="1" />
      <stop offset="24%" stop-color="#ffaa3b" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#ff3d1f" stop-opacity="0.78" />
      <stop offset="78%" stop-color="#b80d24" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#b80d24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb14b" />
      <stop offset="50%" stop-color="#ff4929" />
      <stop offset="100%" stop-color="#c91229" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" />
  <!-- Outer Emulsion Scatter Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#halationHalo)" />
  <!-- 35mm Optical Lens Rings -->
  <circle cx="256" cy="256" r="144" fill="#0b0c0f" stroke="url(#ringGrad)" stroke-width="10" />
  <circle cx="256" cy="256" r="112" fill="none" stroke="#ff5e3a" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="18 10" />
  <!-- Glowing Core Point Light Source -->
  <circle cx="256" cy="256" r="76" fill="url(#halationHalo)" />
  <circle cx="256" cy="256" r="32" fill="#fff7e6" />
</svg>
